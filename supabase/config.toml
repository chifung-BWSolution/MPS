# Supabase project config — linked to project kwcevjcmdjadhrygjyfp
project_id = "kwcevjcmdjadhrygjyfp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5174"
additional_redirect_urls = ["https://localhost:5174"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# User access tokens are ES256. The gateway JWT check still uses the retired
# HS256 secret and rejects a normal logged-in session before this function runs.
# The function validates the session itself with auth.getUser().
[functions.provision-staff-auth]
verify_jwt = false

[functions.gsc-oauth]
verify_jwt = false

[functions.gmail-fcc-oauth]
verify_jwt = false

[functions.sync-fcc-asana-mail]
verify_jwt = false

[functions.sync-bw-asana-mail]
verify_jwt = false

[functions.fcc-asana-digest]
verify_jwt = false

[functions.send-email]
verify_jwt = true

[functions.receivables-alert]
verify_jwt = true

[functions.annual-fees-reminder]
verify_jwt = true

[functions.otc-leave-day-report]
verify_jwt = true

# User access tokens are ES256. The gateway JWT check still uses the retired
# HS256 secret and rejects a normal logged-in session before this function runs.
# The function validates the session itself with auth.getUser().
[functions.bwa-projects]
verify_jwt = false

[functions.framer-oauth]
verify_jwt = false

[functions.readdy-github-fetch]
verify_jwt = false

[functions.readdy-parse-ir]
verify_jwt = false

[functions.framer-mcp-sync]
verify_jwt = false

# One-click conversion queue. User JWTs are ES256 and the cron call uses the
# service role, so the function checks the bearer itself.
[functions.readdy-conversion-worker]
verify_jwt = false

# Content automation (B100 -> MPS tools center)
# content-sites / content-keywords / content-publish / content-digest are called
# from the SPA: user access tokens are ES256 while the gateway still checks the
# retired HS256 secret, so the functions validate the session themselves.
[functions.content-sites]
verify_jwt = false

[functions.content-keywords]
verify_jwt = false

[functions.content-publish]
verify_jwt = false

[functions.content-digest]
verify_jwt = false

# Social desk: called from the SPA (user JWT is ES256, gateway checks HS256).
[functions.content-social]
verify_jwt = false

# content-worker is cron/service-role only; the service_role JWT is HS256 and
# passes the gateway check, and the function additionally checks the role.
[functions.content-worker]
verify_jwt = true

# SEO Radar (tools center): validates the JWT itself via requireActor().
# It must stay verify_jwt = false so ES256 user sessions and service-role cron
# calls both reach the function.
[functions.seo-radar]
verify_jwt = false

# Crosspost copy generator (tools center): called from the SPA.
# User JWT is ES256 while the gateway checks HS256, so validate in-function
# with auth/v1/user (and allow the anon key for dev-bypass logins).
[functions.crosspost-writer]
verify_jwt = false